name: Report a bug
description: Tell us what went wrong and how to reproduce it.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what went wrong and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps and say whether it happens every time.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Game and mod versions
      placeholder: "Example: Bopl Battle 2.5.1, Bopl 8 Players 0.3.4"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Lobby and mod setup
      description: If relevant, say whether you were the host or a guest, how many players were in the room, and which other mods were installed.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional. Remove Steam IDs and other personal information before posting. BepInEx logs are usually in BepInEx/LogOutput.log in your modded profile.
